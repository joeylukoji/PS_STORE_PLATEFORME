<table class="table">
  <thead><tr><th>Article</th><th class="num">Prix unitaire</th><th class="num">Qté</th><th class="num">Sous-total</th></tr></thead>
  <tbody>
    {% for l in order.lines.all %}
    <tr><td>{{ l.product_name }}</td><td class="num">{{ l.unit_price|floatformat:2 }} $</td><td class="num">{{ l.quantity }}</td><td class="num">{{ l.subtotal|floatformat:2 }} $</td></tr>
    {% endfor %}
  </tbody>
  <tfoot><tr><th colspan="3">Total</th><th class="num">{{ order.total|floatformat:2 }} $</th></tr></tfoot>
</table>
