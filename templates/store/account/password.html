{% extends "base.html" %}
{% block title %}Mot de passe{% endblock %}
{% block content %}
<div class="container section auth">
  <form method="post" class="card form auth-card" novalidate>
    {% csrf_token %}
    <h1 class="h2">Changer mon mot de passe</h1>
    {% for f in form %}{% include "_field.html" with field=f %}{% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Enregistrer</button>
    <a href="{% url 'store:account' %}" class="auth-alt">← Retour à mon compte</a>
  </form>
</div>
{% endblock %}
