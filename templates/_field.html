<div class="field {% if field.errors %}has-error{% endif %}" {% if field_id %}id="{{ field_id }}"{% endif %}>
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="check">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
  {% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}
</div>
